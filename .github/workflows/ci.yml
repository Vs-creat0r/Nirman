name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Generated files must match the contracts
      - name: Contract codegen is in sync
        run: npm run gen:check

      # 500-line cap, no `any`, no relative imports
      - name: Lint
        run: npm run lint

      # Code quality ratchet — fail if any counter exceeds its recorded baseline
      - name: Metric ratchet
        run: npm run check:metrics

      # Gate 3 contract-to-UI parity & zero regression invariants
      - name: Gate 3 parity & invariants
        run: npm run check:gate3

      # Path-1 multi-route E2E regression check
      - name: Path-1 E2E regression
        run: node scripts/gate3-path1-e2e.mjs

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

